<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>云盘</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/home.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span class="icon icon-cloud"></span></span>
        <div><h1 id="title">云盘</h1><p id="description" hidden></p></div>
      </div>
      <div class="row header-actions">
        <a class="github-project" href="https://github.com/innboom/telegram-cloud-drive" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看项目" title="在 GitHub 查看项目"></a>
        <select data-drive-language aria-label="语言">
          <option value="zh" lang="zh-CN">中文</option>
          <option value="en" lang="en">English</option>
          <option value="ko" lang="ko">한국어</option>
          <option value="ja" lang="ja">日本語</option>
        </select>
      </div>
    </div>
  </header>
  <main>
    <section class="workspace inbox-panel public-home" aria-labelledby="public-shares-title">
      <h2 id="public-shares-title">公开分享</h2>
      <ul id="public-shares" class="inbox-grid" aria-labelledby="public-shares-title"></ul>
      <p id="public-shares-status" role="status">正在加载公开分享…</p>
      <p id="public-copy-status" role="status"></p>
      <button id="public-shares-more" type="button" hidden>加载更多</button>
    </section>
  </main>
  <button class="copy-share-menu" id="public-copy-share" type="button" hidden>复制分享链接</button>
</body>
</html>
