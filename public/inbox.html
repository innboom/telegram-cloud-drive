<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>公开文件夹</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/inbox.js"></script>
</head>
<body class="inbox-page">
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span class="icon icon-cloud"></span></span>
        <h1>云盘</h1>
      </div>
      <div class="row header-actions">
        <a class="github-project" href="https://github.com/innboom/telegram-cloud-drive" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看项目" title="在 GitHub 查看项目"></a>
        <details class="notification-menu">
          <summary aria-label="通知" title="通知">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12a2 2 0 0 0 4 0"/>
            </svg>
          </summary>
          <section class="notifications inbox-notifications" aria-labelledby="inbox-notice-title">
          <div class="notifications-heading">
            <h2 id="inbox-notice-title">通知</h2>
          </div>
          <div id="inbox-progress" class="upload-progress" hidden>
            <span></span><progress max="100" aria-label="文件上传进度"></progress>
          </div>
          <p id="inbox-status" role="status"></p>
          <p class="inbox-no-notices">暂无通知</p>
          </section>
        </details>
        <select data-drive-language aria-label="语言">
          <option value="zh" lang="zh-CN">中文</option>
          <option value="en" lang="en">English</option>
          <option value="ko" lang="ko">한국어</option>
          <option value="ja" lang="ja">日本語</option>
        </select>
      </div>
    </div>
  </header>
  <main>
    <section id="inbox-start-error" class="inbox-panel" hidden>
      <p id="inbox-start-message" role="alert"></p>
      <button id="inbox-retry" type="button">重试</button>
    </section>
    <div id="inbox-panel" class="inbox-layout" hidden>
    <nav id="inbox-sidebar" class="sidebar" aria-label="文件结构" hidden>
      <div id="inbox-tree" class="directory-scroll" tabindex="0" aria-label="目录树"></div>
    </nav>
    <section class="inbox-panel" aria-labelledby="inbox-title">
      <div id="inbox-folder-loading" class="inbox-folder-loading" role="status" hidden>
        <span>正在打开文件夹…</span>
      </div>
      <form id="inbox-search" class="row inbox-toolbar" role="search" hidden>
        <nav class="inbox-breadcrumbs" aria-label="目录路径">
          <ol id="inbox-path"><li><h1 id="inbox-title" aria-current="location">公开文件夹</h1></li></ol>
        </nav>
        <div id="inbox-view-switch" class="view-switch" role="group" aria-label="文件视图">
          <button type="button" data-view="list" aria-pressed="false">列表</button>
          <button type="button" data-view="grid" aria-pressed="true">网格</button>
        </div>
        <select name="sort" aria-label="排序">
          <option value="created-desc">创建时间 · 最新</option>
          <option value="created-asc">创建时间 · 最早</option>
          <option value="name-asc">名称 · 升序</option>
          <option value="name-desc">名称 · 降序</option>
          <option value="size-desc">大小 · 从大到小</option>
          <option value="size-asc">大小 · 从小到大</option>
        </select>
        <select id="inbox-type" name="type" aria-label="文件类型">
          <option value="">全部类型</option>
          <option value="folder">文件夹</option>
          <option value="image">图片</option>
          <option value="video">视频</option>
          <option value="audio">音频</option>
          <option value="pdf">PDF</option>
          <option value="document">文档</option>
          <option value="sheet">表格</option>
          <option value="slides">演示文稿</option>
          <option value="archive">压缩包</option>
          <option value="code">代码和网页</option>
          <option value="app">安装包</option>
        </select>
        <label class="search-field"><span class="icon icon-search" aria-hidden="true"></span><input id="inbox-query" type="search" placeholder="搜索当前目录" aria-label="搜索当前目录" maxlength="120"></label>
        <button id="inbox-mkdir" class="mkdir-button" type="button" aria-label="新建文件夹" title="新建文件夹">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </form>
      <div class="inbox-file-list">
        <div class="inbox-list-heading list-heading" aria-hidden="true">
          <span>名称</span><span>创建时间</span><span>类型</span><span>大小</span><span>操作</span>
        </div>
        <div class="file-scroll" tabindex="0" aria-label="文件列表">
          <ul id="inbox-entries" class="inbox-grid" aria-label="文件"></ul>
          <p id="inbox-empty" hidden>这个文件夹还没有文件。</p>
          <div id="inbox-more" aria-hidden="true" hidden></div>
          <button id="inbox-more-retry" type="button" hidden>重试</button>
        </div>
      </div>
      <form id="inbox-form" class="upload-toolbar" hidden>
        <input id="inbox-files" type="file" multiple hidden>
        <input id="inbox-directory" type="file" webkitdirectory multiple hidden>
        <div class="upload-note">
          <textarea id="inbox-note" rows="2" placeholder="输入或粘贴文字" aria-label="输入或粘贴文字"></textarea>
          <div class="actions">
            <details id="inbox-upload-options" class="upload-options">
              <summary aria-label="上传文件和文件夹" title="上传文件和文件夹">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 16V3m-5 5 5-5 5 5M5 15v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/>
                </svg>
              </summary>
              <div class="action-panel">
                <button id="inbox-submit" type="button">上传文件</button>
                <button id="inbox-choose-directory" type="button">上传文件夹</button>
              </div>
            </details>
          </div>
          <button id="inbox-send-note" class="primary" type="submit" disabled>发送</button>
        </div>
      </form>
    </section>
    <footer class="drive-footer">由 Telegram Cloud Drive 提供</footer>
    </div>
  </main>
  <button id="inbox-copy-share" type="button" hidden>复制分享链接</button>
  <dialog id="inbox-preview" class="media-preview" aria-labelledby="inbox-preview-title">
    <header class="media-header">
      <div class="media-heading"><h2 id="inbox-preview-title"></h2><p class="media-details"></p></div>
      <div class="row">
        <button type="button" data-preview-full aria-label="在新标签页查看" title="在新标签页查看" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
        <button type="button" data-preview-download>下载原文件</button>
        <button type="button" data-preview-close aria-label="关闭">×</button>
      </div>
    </header>
    <div class="media-stage">
      <button type="button" data-previous aria-label="上一项"></button>
      <div id="preview-content"></div>
      <p id="preview-status" role="status"></p>
      <button type="button" data-next aria-label="下一项"></button>
    </div>
    <footer class="media-position" aria-live="polite"></footer>
  </dialog>
</body>
</html>
